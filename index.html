<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1a2a" />
  <meta name="description" content="CodoVision portfolio — AI-driven software solutions, past work, and project showcases." />
  <title>CodoVision | Portfolio Flipbook</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=responsive-2" />
</head>
<body class="is-immersive">
  <div class="app">
    <header class="topbar" hidden>
      <div class="topbar-actions">
        <span class="engine-badge" id="engineBadge" hidden></span>
        <button type="button" class="btn ghost" id="tocBtn" aria-label="Open table of contents">Contents</button>
        <button type="button" class="btn ghost" id="fullscreenBtn" aria-label="Toggle fullscreen">Fullscreen</button>
        <a class="btn primary" href="https://codovision.tech/" target="_blank" rel="noopener noreferrer">Website</a>
      </div>

      <a class="brand" href="https://codovision.tech/" target="_blank" rel="noopener noreferrer">
        <div class="brand-text">
          <span class="brand-name">CODOVISION</span>
          <span class="brand-tag">AI-Driven Software Solutions</span>
        </div>
        <img src="assets/logo.png" alt="CodoVision logo" width="40" height="40" />
      </a>
    </header>

    <main class="stage">
      <button type="button" class="nav-btn prev" id="prevBtn" aria-label="Previous page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5.5 9 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="book-shell">
        <div class="spread-badge" id="spreadBadge" aria-live="polite">1 / 32</div>
        <div id="flipbook" class="flipbook" aria-label="CodoVision portfolio flipbook"></div>
        <div class="loader" id="loader">
          <div class="loader-ring"></div>
          <p>Opening portfolio…</p>
        </div>
      </div>

      <button type="button" class="nav-btn next" id="nextBtn" aria-label="Next page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5 15 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </main>

    <footer class="toolbar" hidden>
      <div class="page-meta">
        <span id="pageLabel">Page 1</span>
        <span class="dot" aria-hidden="true"></span>
        <span id="pageTitle">Cover</span>
      </div>
      <input type="range" id="pageSlider" min="1" max="17" value="1" aria-label="Jump to page" />
      <p class="hint">Drag a corner to turn the page</p>
    </footer>
  </div>

  <aside class="toc" id="toc" hidden>
    <div class="toc-panel" role="dialog" aria-modal="true" aria-labelledby="tocHeading">
      <div class="toc-head">
        <h2 id="tocHeading">Contents</h2>
        <button type="button" class="icon-btn" id="tocClose" aria-label="Close contents">×</button>
      </div>
      <ol id="tocList"></ol>
    </div>
  </aside>

  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
